name: Pandora Studio runtime refactor verification
on:
  push:
    branches:
      - refactor/studio-names-and-architecture-20261102
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Apply deterministic runtime renames
        run: node scripts/refactor-studio-runtime.mjs --apply
      - name: Bump release cache identifiers
        run: |
          if grep -q '"2026.11.02.301"' site-version.json; then
            node scripts/release-version.mjs 2026.11.02.302 'Pandora Studio modules named and dependency links audited'
          fi
      - name: Audit cross-file wiring
        run: node scripts/audit-studio-dependencies.mjs
      - name: Run complete Node regression suite
        run: npm test
      - name: Check release metadata
        run: npm run release:check
      - name: Set up pinned Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.1
          npx playwright install chromium
          if ! node --input-type=module -e "import { chromium } from 'playwright'; const browser = await chromium.launch({headless:true}); await browser.close();"; then
            npx playwright install-deps chromium
          fi
      - name: Browser acceptance across responsive layouts
        run: |
          node scripts/dev-server.mjs &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          node tests/browser-smoke.mjs
      - name: Commit only verified changes on feature branch
        run: |
          git config user.name 'Pandora Studio CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'refactor: brand runtime modules and update all verified imports (0.302.0)'
            git push origin HEAD:refactor/studio-names-and-architecture-20261102
          fi
