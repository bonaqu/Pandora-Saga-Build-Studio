name: Publish seven reviewed item levels 55 to 50 in D1 (one time)

on:
  # The repository owner requested this exact correction for issue #683.
  # Only the reviewed addition of this workflow to the default branch runs
  # automatically. It never runs on every site release or a schedule.
  push:
    branches: [bonaqu_projects]
    paths:
      - '.github/workflows/publish-seven-item-levels-once.yml'
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type PUBLISH-7-ITEM-LEVELS-20261117 to retry guarded publication'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: pandora-seven-level-item-d1-production-publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'bonaqu/Pandora-Saga-Build-Studio' &&
      github.ref == 'refs/heads/bonaqu_projects' &&
      (github.event_name == 'push' ||
       inputs.confirmation == 'PUBLISH-7-ITEM-LEVELS-20261117')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 57ac934cd0f0a7f5e8533177d612f893
      PS_D1_DATABASE_ID: 0f8fbcd8-be06-414c-844b-a2091fdf6784
    steps:
      - name: Checkout reviewed default branch only
        uses: actions/checkout@v5
        with:
          ref: bonaqu_projects
      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate immutable scope and offline publication guards (no writes)
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$CLOUDFLARE_ACCOUNT_ID" = '57ac934cd0f0a7f5e8533177d612f893'
          test "$PS_D1_DATABASE_ID" = '0f8fbcd8-be06-414c-844b-a2091fdf6784'
          node --check scripts/publish-seven-item-levels-once.mjs
          node --test tests/d1-seven-item-level-publication.test.mjs tests/d1-seven-item-level-50-selective.test.mjs
      - name: Require exactly seven known live item level mismatches (read-only)
        run: node scripts/publish-seven-item-levels-once.mjs --preflight
      - name: Stage exact D1 copy and publish only seven levels using snapshot CAS
        run: node scripts/publish-seven-item-levels-once.mjs --publish-owner-authorized-seven-levels-20261117
      - name: Confirm public Worker now serves all seven level-50 items (read-only)
        run: node scripts/publish-seven-item-levels-once.mjs --verify-published
      - name: Require all 16 gameplay catalog datasets match production D1
        run: npm run catalog:parity:live
