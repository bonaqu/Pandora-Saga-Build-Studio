name: Live Pages and Worker readiness (on release or manual)

on:
  # No cron/scheduled run: avoid background GitHub Actions usage.
  # Keep only release-related checks and an explicit manual run.
  # The built-in GitHub Pages deployment uses event="dynamic" and has not
  # emitted workflow_run here. A branch push check must wait for the public
  # release before reading Worker/D1 so queued deployments aren't misreported.
  push:
    branches: [bonaqu_projects]
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
    branches: [bonaqu_projects]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # New releases supersede obsolete version waits for this single live site.
  group: live-readonly-bonaqu_projects
  cancel-in-progress: true

jobs:
  check-live:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout published revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Use Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Wait for expected public Pages version (read-only)
        run: node scripts/wait-live-release.mjs
      - name: Check Pages version, Worker health, D1 catalog and CORS (read-only)
        run: npm run connection:check:full
      - name: Compare 16 published gameplay datasets against the same D1 snapshot (read-only)
        run: npm run catalog:parity:live
