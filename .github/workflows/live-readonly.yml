name: Live Pages and Worker readiness

on:
  # Verify only after GitHub Pages reports a successful deployment.
  # A concurrent push check used to fail after 2 minutes while Pages remained
  # queued (and still served the previous release), creating false CI alarms.
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
    branches: [bonaqu_projects]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-readonly-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  check-live:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout published revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Use Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Wait for expected public Pages version (read-only)
        run: node scripts/wait-live-release.mjs
      - name: Check Pages version, Worker health, D1 catalog and CORS (read-only)
        run: npm run connection:check:full
