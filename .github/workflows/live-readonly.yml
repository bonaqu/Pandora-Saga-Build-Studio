name: Live Pages and Worker readiness (on release or manual)

on:
  # No cron/scheduled run: avoid background GitHub Actions usage.
  # Keep only release-related checks and an explicit manual run.
  # A branch push check waits for the deployed Pages release before auditing.
  push:
    branches: [bonaqu_projects]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # New releases supersede obsolete version waits for this single live site.
  group: live-readonly-bonaqu_projects
  cancel-in-progress: true

jobs:
  check-live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout published revision
        uses: actions/checkout@v5
      - name: Use Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Wait for expected public Pages version (read-only)
        run: node scripts/wait-live-release.mjs
      - name: Check Pages version, Worker health, D1 catalog and CORS (read-only)
        run: npm run connection:check:release
      - name: Verify guest denial and account-only Worker capabilities (read-only)
        run: node scripts/check-build-account-only-live.mjs
      - name: Compare 16 published gameplay datasets against the same D1 snapshot (read-only)
        run: npm run catalog:parity:live
      # Query metrics come from Analytics, never SQL reads or D1 mutations.
      - name: Report D1 query row costs (Analytics only, no D1 SQL)
        if: success()
        continue-on-error: true
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 57ac934cd0f0a7f5e8533177d612f893
          PS_D1_DATABASE_ID: 0f8fbcd8-be06-414c-844b-a2091fdf6784
        run: |
          node scripts/prepare-config.mjs
          node scripts/check-readonly-d1-incident.mjs --insights-only
      # Failed live releases need schema evidence, not automatic catalog
      # restoration or any production D1 mutation. Secrets stay in this step.
      - name: Diagnose failed production D1 catalog and account schema (read-only)
        if: failure()
        continue-on-error: true
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 57ac934cd0f0a7f5e8533177d612f893
          PS_D1_DATABASE_ID: 0f8fbcd8-be06-414c-844b-a2091fdf6784
        run: |
          node scripts/prepare-config.mjs
          node scripts/check-readonly-d1-incident.mjs
