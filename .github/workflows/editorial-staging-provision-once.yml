# #390 one-shot isolated D1 provisioning. NEVER touches production D1.
# Remove from the PR branch after recording the result.
name: Editorial D1 staging bootstrap (one shot)
on:
  push:
    branches: [work/947-issue390-editorial-parity]
    paths: [.github/workflows/editorial-staging-provision-once.yml]
permissions: {}
jobs:
  bootstrap:
    if: github.repository == 'bonaqu/Pandora-Saga-Build-Studio' && github.ref == 'refs/heads/work/947-issue390-editorial-parity'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Create only dedicated nonproduction D1 if absent
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const token=process.env.CLOUDFLARE_API_TOKEN;
          if(!token){console.error('Existing Cloudflare token not available');process.exit(1)}
          const account='57ac934cd0f0a7f5e8533177d612f893';
          const production='0f8fbcd8-be06-414c-844b-a2091fdf6784';
          const name='ps-editorial-staging-390';
          const base='https://api.cloudflare.com/client/v4/accounts/'+account;
          const uuidPattern=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
          const fail=message=>{console.error(message);process.exit(1)};
          async function request(path,method='GET',payload=null){
            let response;
            try{
              response=await fetch(base+path,{
                method,redirect:'error',signal:AbortSignal.timeout(15000),
                headers:{Authorization:'Bearer '+token,
                  ...(payload?{'Content-Type':'application/json'}:{})},
                ...(payload?{body:JSON.stringify(payload)}:{})
              });
            }catch{fail('Cloudflare request failed without making any production writes')}
            if(!response.ok)fail('Cloudflare D1 '+method+' failed with HTTP '+response.status);
            const data=await response.json().catch(()=>null);
            if(data?.success!==true)fail('Cloudflare D1 '+method+' returned an unsuccessful result');
            return data;
          }
          async function inventory(){
            const rows=[];let completed=false;
            for(let page=1;page<=50;page++){
              const data=await request('/d1/database?per_page=100&page='+page);
              if(!Array.isArray(data.result))fail('Unexpected D1 inventory');
              rows.push(...data.result);
              const total=data.result_info?.total_pages;
              if(Number.isInteger(total)?page>=total:data.result.length<100){
                completed=true;break;
              }
            }
            if(!completed)fail('D1 inventory pagination not complete');
            if(!rows.some(row=>row?.uuid===production))
              fail('Known production database not visible: cannot prove account identity');
            return rows;
          }
          const before=await inventory();
          const existing=before.filter(row=>row?.name===name);
          if(existing.length>1)fail('Ambiguous staging database identity');
          let uuid;
          if(existing.length===1){
            uuid=existing[0].uuid;
            console.log('Isolated staging already existed; no database created.');
          }else{
            console.log('No isolated editorial staging found; requesting exactly one nonproduction database.');
            const created=await request('/d1/database','POST',{name});
            uuid=created?.result?.uuid;
            if(created?.result?.name!==name||!uuidPattern.test(uuid||''))
              fail('Cloudflare creation response did not verify isolated staging identity');
            console.log('Cloudflare acknowledged isolated staging creation.');
          }
          if(!uuidPattern.test(uuid||'')||uuid===production)
            fail('Unsafe staging UUID; refusing all further steps');
          const after=await inventory();
          const found=after.filter(row=>row?.name===name&&row?.uuid===uuid);
          if(found.length!==1)fail('Staging identity not confirmed by independent metadata readback');
          console.log('Verified isolated staging name: '+name);
          console.log('Verified isolated staging UUID: '+uuid);
          console.log('Production database remains a distinct UUID.');
          console.log('No D1 SQL executed; no Worker/Pages deployment or production mutation.');
          JS
