# #390: exact-SHA production editorial D1 inventory only. NEVER a migration.
name: "#390 production editorial D1 READ ONLY preflight"

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  actions: read

concurrency:
  group: pandora-issue390-production-readonly
  cancel-in-progress: false

jobs:
  inspect:
    if: >-
      github.repository == 'bonaqu/Pandora-Saga-Build-Studio' &&
      github.event.pull_request.number == 809 &&
      github.event.pull_request.base.ref == 'bonaqu_projects' &&
      github.event.pull_request.head.repo.full_name == 'bonaqu/Pandora-Saga-Build-Studio' &&
      github.event.pull_request.head.ref == 'work/947-issue390-editorial-parity' &&
      github.event.label.name == 'ps390-production-readonly'
    name: Exact production D1 and Worker SELECT-only inventory
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PS_EDITORIAL_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      GITHUB_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 57ac934cd0f0a7f5e8533177d612f893
      PS_D1_DATABASE_ID: 0f8fbcd8-be06-414c-844b-a2091fdf6784
    steps:
      - name: Checkout exact owner-owned PR source
        uses: actions/checkout@v5
        with:
          ref: work/947-issue390-editorial-parity
          persist-credentials: false
      - name: Use Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Require same-SHA Node and Chromium SUCCESS
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PS_EDITORIAL_EXPECTED_SHA"
          test -z "$(git status --porcelain)"
          node scripts/check-editorial-staging-approval.mjs ci
      - name: Strict read-only production D1 target and Worker preflight
        run: node scripts/check-editorial-production-readonly.mjs
      - name: Confirm no mutation or deployment commands were introduced
        run: |
          set -euo pipefail
          ! grep -Eiq '(wrangler.*(deploy|delete)|d1 execute.*--file|d1 migrations apply)' .github/workflows/editorial-production-readonly-390.yml
          echo 'Preflight uses D1 list, SELECT-only and schema PRAGMA; no writes.'
