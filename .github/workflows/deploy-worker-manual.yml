name: Deploy existing Pandora Worker (manual, no D1 migrations)

on:
  push:
    branches: [bonaqu_projects]
    paths:
      # Any imported Worker runtime module must trigger a fresh production deploy.
      # Do not auto-run migrations: only JavaScript source changes deploy.
      - 'worker/*.js'
      - .github/workflows/deploy-worker-manual.yml
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY-0.360-TO-ps-build-studio-cloud'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pandora-production-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/bonaqu_projects'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 57ac934cd0f0a7f5e8533177d612f893
      PS_D1_DATABASE_ID: 0f8fbcd8-be06-414c-844b-a2091fdf6784
    steps:
      - name: Checkout reviewed Worker revision
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify explicit deployment confirmation, target and source fields
        env:
          CONFIRM: ${{ github.event_name == 'push' && 'DEPLOY-0.360-TO-ps-build-studio-cloud' || inputs.confirmation }}
        run: |
          test "$CONFIRM" = 'DEPLOY-0.360-TO-ps-build-studio-cloud'
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$CLOUDFLARE_ACCOUNT_ID" = '57ac934cd0f0a7f5e8533177d612f893'
          test "$PS_D1_DATABASE_ID" = '0f8fbcd8-be06-414c-844b-a2091fdf6784'
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const code=readFileSync("index.js","utf8");
            for(const marker of ["codeRelease:\x270.360.0\x27",
              "\x27bilingual-item-text\x27", "adminD1WriteCheck:\x27catalog-and-overrides\x27", "catalogSourceFailover:true", "sourceEgressProbe:true", "sourceInstancesArray:true", "sourceFullProbe:true", "key===\x27nameEn\x27", "key===\x27descEn\x27", "honorExtendedEditing:true", "wikiLabelEditing:true"])
              if(!code.includes(marker))throw Error("Missing expected reviewed Worker code: "+marker);
          '
      - name: Generate exact existing D1 config without secrets
        run: node scripts/prepare-config.mjs
      - name: Check live Worker health before updating code (read-only)
        run: |
          node --input-type=module -e '
            const response=await fetch("https://ps-build-studio-cloud.bonaqu.workers.dev/api/health",
              {signal:AbortSignal.timeout(15000)});
            const data=await response.json();
            if(!response.ok||data.storage!=="d1"||data.features?.catalog!==true||
              data.features?.library!==true||data.features?.accounts!==true)
              throw Error("Existing Worker/D1 is not healthy; refusing deploy");
            console.log("Live production Worker and D1 are ready; no D1 write executed");
          '
      - name: Compile Worker safely without upload
        run: npx --yes wrangler@4 deploy --dry-run --outdir /tmp/pandora-worker-preview --keep-vars
      - name: Deploy Worker code while preserving dashboard variables and existing secrets
        run: npx --yes wrangler@4 deploy --keep-vars
      - name: Verify exact Worker release, D1 admin diagnostics and health (read-only)
        run: |
          node --input-type=module -e '
            const url="https://ps-build-studio-cloud.bonaqu.workers.dev";
            for(let attempt=0;attempt<8;attempt++){
              const response=await fetch(url+"/api/runtime-capabilities",
                {cache:"no-store",signal:AbortSignal.timeout(15000)});
              const caps=await response.json().catch(()=>null);
              const healthy=await fetch(url+"/api/health",
                {cache:"no-store",signal:AbortSignal.timeout(15000)});
              const health=await healthy.json().catch(()=>null);
              if(response.ok&&caps?.codeRelease==="0.360.0"&&
                caps?.ownerEditors?.includes("bilingual-item-text")&&
                caps?.adminD1WriteCheck==="catalog-and-overrides"&&
                caps?.catalogSourceFailover===true&&caps?.honorExtendedEditing===true&&caps?.wikiLabelEditing===true&&caps?.sourceEgressProbe===true&&
                caps?.sourceInstancesArray===true&&caps?.sourceFullProbe===true&&
                healthy.ok&&health?.storage==="d1"&&health?.features?.catalog===true){
                console.log("Verified live Worker 0.360.0, English item editing and the same D1 catalog");
                process.exit(0);
              }
              if(attempt<7)await new Promise(resolve=>setTimeout(resolve,4000));
            }
            throw Error("Worker not yet serving 0.360.0 with bilingual-item-text and healthy D1");
          '

      - name: Probe Worker egress to public game metadata (read-only, no auth, no D1 writes)
        run: |
          node --input-type=module -e '
            const url="https://ps-build-studio-cloud.bonaqu.workers.dev/api/source-health";
            try{
              const response=await fetch(url+"?ci="+Date.now(),{signal:AbortSignal.timeout(22000)});
              const body=await response.json().catch(()=>null);
              if(response.ok&&body?.status==="ok"){
                console.log("SOURCE_OK: production Worker can fetch current game metadata");
              }else{
                console.warn("SOURCE_UNAVAILABLE: ",JSON.stringify({status:response.status,
                  code:body?.code,attempts:body?.attempts}));
                console.warn("Upstream source access may require game-site permissions; D1 unchanged.");
              }
            }catch(error){console.warn("SOURCE_PROBE_ERROR:",error.message)}
          '

      - name: Check all 17 game files independently of successful Worker deployment (read-only)
        run: |
          node --input-type=module -e '
            const url="https://ps-build-studio-cloud.bonaqu.workers.dev/api/source-health?scope=all";
            try{
              const response=await fetch(url,{signal:AbortSignal.timeout(18000)});
              const data=await response.json().catch(()=>null);
              if(response.ok&&data?.status==="ok"&&data?.checked===17&&
                 Array.isArray(data.failures)&&!data.failures.length){
                console.log("GAME_DATA_OK: all 17 official JSON files are accessible from Worker");
              }else{
                console.warn("GAME_DATA_WARNING: external game-site check could not finish: ",
                 JSON.stringify({status:response.status,checked:data?.checked,
                  failures:data?.failures}));
              }
            }catch(error){
              console.warn("GAME_DATA_WARNING: external check delayed:",error.message);
            }
          '
