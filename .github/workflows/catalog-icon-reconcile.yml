name: Recover original game icons after a verified catalog release

on:
  # The catalog auto-merge is made with GITHUB_TOKEN and may not trigger
  # push workflows, so keep its trusted completion event. Ordinary releases
  # dispatch ONLY if a post-parity preflight finds unprobed source icons.
  workflow_run:
    workflows:
      - Verified catalog fallback auto-merge
    types: [completed]
    branches:
      - bonaqu_projects
  workflow_dispatch:
    inputs:
      mode:
        description: 'new: only unprobed identities; retry-404: also recheck original source 404s'
        type: choice
        options:
          - retry-404
          - new
        default: retry-404

permissions:
  contents: write
  pull-requests: write
  actions: write
  pages: write

concurrency:
  group: catalog-original-icons-main
  cancel-in-progress: false

jobs:
  mirror:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'bonaqu_projects' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout trusted published source
        uses: actions/checkout@v5
        with:
          ref: bonaqu_projects
          fetch-depth: 1
      - name: Use Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Mirror only unprobed game icon identities
        if: >-
          github.event_name == 'workflow_run' || inputs.mode == 'new'
        run: node scripts/mirror-os-icons.mjs --limit=90
      - name: Manually recheck historical HTTP 404 originals
        if: >-
          github.event_name == 'workflow_dispatch' && inputs.mode != 'new'
        run: node scripts/mirror-os-icons.mjs --retry-404
      - name: Recover exact PvP event screenshot where available
        run: node scripts/mirror-honor-victories.mjs
      - name: Validate all local image identities and WebP bytes
        run: npm run assets:audit
      - name: Create, exact-test and merge an original-only asset PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/catalog-icon-reconcile-ci.mjs
