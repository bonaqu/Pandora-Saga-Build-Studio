# #390 temporary diagnostic: check existing GitHub-managed Cloudflare access.
# No checkout, no D1 SQL, no database creation, no Worker/Pages deployment.
# Remove this branch-only probe after recording its result.
name: Editorial Cloudflare access probe (metadata only)
on:
  push:
    branches: [work/947-issue390-editorial-parity]
    paths: [.github/workflows/editorial-cloudflare-access-probe.yml]
permissions: {}
jobs:
  inspect:
    if: github.repository == 'bonaqu/Pandora-Saga-Build-Studio' && github.ref == 'refs/heads/work/947-issue390-editorial-parity'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect D1 account metadata using existing secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const token=process.env.CLOUDFLARE_API_TOKEN;
          if(!token){console.log('Existing Cloudflare secret is unavailable to this job');process.exit(1)}
          const account='57ac934cd0f0a7f5e8533177d612f893';
          const production='0f8fbcd8-be06-414c-844b-a2091fdf6784';
          let seenProduction=false,stagingCount=0,complete=false;
          for(let page=1;page<=50;page++){
            let response;
            try{
              response=await fetch('https://api.cloudflare.com/client/v4/accounts/'+account+
                '/d1/database?per_page=100&page='+page,{
                headers:{Authorization:'Bearer '+token},
                redirect:'error',signal:AbortSignal.timeout(10000)
              });
            }catch{console.log('Cloudflare metadata request failed');process.exit(1)}
            if(!response.ok){console.log('Cloudflare metadata HTTP status: '+response.status);process.exit(1)}
            const data=await response.json().catch(()=>null);
            if(data?.success!==true||!Array.isArray(data.result)){
              console.log('Unexpected Cloudflare metadata response');process.exit(1)
            }
            for(const row of data.result){
              if(row?.uuid===production)seenProduction=true;
              if(row?.uuid!==production&&typeof row?.name==='string'&&
                /^ps-editorial-staging-[a-z0-9-]+$/.test(row.name))stagingCount++;
            }
            const total=data.result_info?.total_pages;
            if(Number.isInteger(total)?page>=total:data.result.length<100){complete=true;break}
          }
          if(!complete){console.log('D1 metadata pagination incomplete');process.exit(1)}
          console.log('Existing secret authenticated: D1 metadata read succeeded');
          console.log('Known production database visible: '+seenProduction);
          console.log('Matching isolated editorial staging database count: '+stagingCount);
          console.log('No SQL executed, no database or Worker changed. D1 write scope not proven.');
          JS
