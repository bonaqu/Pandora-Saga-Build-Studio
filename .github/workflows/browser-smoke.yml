name: Chromium browser smoke

on:
  pull_request:
    branches: [bonaqu_projects]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'tests/*.test.mjs'
      - 'artifacts/**'
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Optional isolated Chromium flow for debugging (manual only)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: browser-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    # Playwright 1.55.1 cannot install Chromium on the newer ubuntu-26.04 image.
    # Pin the supported Ubuntu LTS image rather than silently skipping smoke.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2 # Compare PR merge with its first parent; full suite if unavailable
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Choose full or targeted browser regression suite
        id: suite
        shell: bash
        run: |
          mode=full
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            if selected=$(node scripts/select-browser-suite.mjs); then
              mode="$selected"
            else
              echo 'Could not classify PR diff; falling back to full Chromium'
            fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Chromium suite: $mode"
      - name: Reuse pinned Playwright Chromium downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-playwright-1.55.1
      - name: Install Chromium and verify its OS dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.55.1
          npx playwright install chromium
          # Most GitHub runners already have the required shared libraries.
          # Skip apt update/install if a real headless launch already works.
          # If it does not, install the pinned Playwright dependencies exactly
          # as before; never leave the real browser smoke without Chromium.
          if ! node --input-type=module -e "import { chromium } from 'playwright'; const browser = await chromium.launch({headless:true}); await browser.close();"; then
            npx playwright install-deps chromium
          fi
      - name: Exercise the real editor in Chromium
        env:
          BROWSER_SCENARIO: ${{ github.event_name == 'workflow_dispatch' && inputs.scenario || '' }}
        run: |
          node scripts/dev-server.mjs &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' && -n "${BROWSER_SCENARIO:-}" ]]; then
            # Only manually requested diagnostic runs may select a single flow.
            node tests/browser-smoke.mjs "--only=$BROWSER_SCENARIO"
          elif [[ "${{ steps.suite.outputs.mode }}" == 'quick' ]]; then
            node tests/browser-smoke.mjs --quick
          else
            node tests/browser-smoke.mjs
          fi
      - name: Upload desktop and mobile layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-layout-${{ github.sha }}
          path: artifacts/layout/
          if-no-files-found: ignore
          retention-days: 14
